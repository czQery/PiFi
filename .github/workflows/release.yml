name: Release

on:
    release:
        branches: [main]
        types:
            - created

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        strategy:
            fail-fast: false
            matrix:
                arch: [arm]
                arm: [6, 7]
                include:
                    - arch: amd64
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set env
              run: echo "ASSET_NAME=release-${{matrix.arch}}${{matrix.arm}}" >> $GITHUB_ENV

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Bun install dependencies
              working-directory: ./frontend
              run: bun i

            - name: Bun build
              working-directory: ./frontend
              run: |
                  bun --env-file=.env.production run build
                  mkdir -p ../${{env.ASSET_NAME}} && cp -r dist ../${{env.ASSET_NAME}}/dist

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "1.26"
                  cache-dependency-path: "./backend/go.sum"

            - name: Go get
              working-directory: ./backend
              run: go mod download

            - name: Go build
              working-directory: ./backend
              env:
                  GOOS: linux
                  GOARM: ${{matrix.arm}}
                  GOARCH: ${{matrix.arch}}
                  CGO_ENABLED: 0
              run: |
                  go build -o pifi -ldflags="-s -w -X github.com/czQery/PiFi/backend/hp.Build=${{github.event.release.tag_name}}"
                  cp -r pifi ../${{env.ASSET_NAME}}

            - name: Include portals
              working-directory: ./backend
              run: cp -r portal ../${{env.ASSET_NAME}}/portal

            - name: Compress release
              uses: thedoctor0/zip-release@0.7.6
              with:
                  type: "tar"
                  path: ${{env.ASSET_NAME}}/
                  filename: "${{env.ASSET_NAME}}.tar.gz"

            - name: Upload release
              uses: ncipollo/release-action@v1.21.0
              with:
                  allowUpdates: true
                  replacesArtifacts: true
                  makeLatest: false
                  omitName: true
                  prerelease: true
                  omitBody: true
                  artifacts: "${{env.ASSET_NAME}}.tar.gz"
                  token: ${{ secrets.GITHUB_TOKEN }}
